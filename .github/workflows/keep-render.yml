name: Keep Render Website Alive

on:
  schedule:
    # Hạ xuống 5 phút một lần để bù trừ cho việc GitHub Actions thường xuyên bị delay
    - cron: '*/5 * * * *'
  workflow_dispatch: 

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Gửi yêu cầu HTTP Ping tới Render
        run: |
          echo "Bắt đầu ping Render..."
          # Đổi endpoint bên dưới thành endpoint thực tế đang chạy trên web của bạn (ví dụ: /swagger/index.html hoặc /api/values nếu có)
          RESPONSE=$(curl -v -w " [%{http_code}]" https://dormitorymanagementsystem.onrender.com/ping)
          echo "Kết quả từ Render: $RESPONSE"
          echo "Đã hoàn thành ping lúc: $(date)"