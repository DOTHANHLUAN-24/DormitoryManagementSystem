name: Keep Render Website Alive

on:
  schedule:
    # Chạy mỗi 10 phút một lần để duy trì Render không bị sleep (free tier tắt sau 15 phút không hoạt động)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Cho phép kích hoạt thủ công từ GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Gửi yêu cầu HTTP Ping tới Render
        run: |
          echo "Bắt đầu ping Render..."
          RESPONSE=$(curl -s -w " [%{http_code}]" https://dormitorymanagementsystem.onrender.com/ping)
          echo "Kết quả từ Render: $RESPONSE"
          echo "Đã hoàn thành ping lúc: $(date)"