<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Ký túc xá - Danh sách phòng</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <div class="khung-chinh">
        <!-- Thanh bên -->
        <div class="thanh-ben">
            <div class="logo">
                <i class="fas fa-building"></i>
                <span>Quản lý Ký túc xá</span>
            </div>
            <nav class="menu-dieu-huong">
                <a href="#" class="muc-menu active">
                    <i class="fas fa-door-open"></i>
                    <span>Danh sách phòng</span>
                </a>
                <a href="#" class="muc-menu">
                    <i class="fas fa-users"></i>
                    <span>Quản lý sinh viên</span>
                </a>
                <a href="#" class="muc-menu">
                    <i class="fas fa-file-invoice-dollar"></i>
                    <span>Hóa đơn</span>
                </a>
                <a href="#" class="muc-menu">
                    <i class="fas fa-tools"></i>
                    <span>Sửa chữa</span>
                </a>
                <a href="#" class="muc-menu">
                    <i class="fas fa-chart-line"></i>
                    <span>Thống kê</span>
                </a>
            </nav>
            <div class="thong-tin-nguoi-dung">
                <img src="https://ui-avatars.com/api/?background=4F46E5&color=fff&name=NV+Quan+Ly" alt="Avatar">
                <div class="chi-tiet-nguoi-dung">
                    <span class="ten-nguoi-dung">Nguyễn Văn A</span>
                    <span class="vai-tro">Quản lý KTX</span>
                </div>
            </div>
        </div>
        <!-- Nội dung chính -->
        <main class="noi-dung-chinh">
            <header class="dau-trang">
                <h1 class="tieu-de-trang">Danh sách phòng</h1>
                <div class="hanh-dong-dau-trang">
                    <button class="nut-loc" id="nutLoc">
                        <i class="fas fa-sliders-h"></i>
                        Lọc
                    </button>
                    <button class="nut-them" id="nutThemPhong">
                        <i class="fas fa-plus"></i>
                        Thêm phòng
                    </button>
                </div>
            </header>

            <!-- Thanh tìm kiếm & bộ lọc -->
            <div class="thanh-tim-kiem">
                <div class="khung-tim-kiem">
                    <i class="fas fa-search"></i>
                    <input type="text" id="timKiem" placeholder="Tìm kiếm theo tên phòng, tòa nhà...">
                </div>
                <div class="nhom-loc">
                    <select id="locTheoToaNha" class="chon-loc">
                        <option value="">Tất cả tòa nhà</option>
                        <option value="A">Tòa A</option>
                        <option value="B">Tòa B</option>
                        <option value="C">Tòa C</option>
                    </select>
                    <select id="locTheoTrangThai" class="chon-loc">
                        <option value="">Tất cả trạng thái</option>
                        <option value="con_trong">Còn trống</option>
                        <option value="day">Đã đầy</option>
                        <option value="bao_tri">Đang bảo trì</option>
                    </select>
                </div>
            </div>

            <!-- Thẻ thống kê -->
            <div class="the-thong-ke">
                <div class="the-thong-ke-item">
                    <div class="icon-thong-ke xanh-duong">
                        <i class="fas fa-door-open"></i>
                    </div>
                    <div class="thong-tin-thong-ke">
                        <h3 id="tongSoPhong">0</h3>
                        <p>Tổng số phòng</p>
                    </div>
                </div>
                <div class="the-thong-ke-item">
                    <div class="icon-thong-ke xanh-la">
                        <i class="fas fa-check-circle"></i>
                    </div>
                    <div class="thong-tin-thong-ke">
                        <h3 id="soPhongConTrong">0</h3>
                        <p>Phòng còn trống</p>
                    </div>
                </div>
                <div class="the-thong-ke-item">
                    <div class="icon-thong-ke cam">
                        <i class="fas fa-user-friends"></i>
                    </div>
                    <div class="thong-tin-thong-ke">
                        <h3 id="soPhongDay">0</h3>
                        <p>Phòng đã đầy</p>
                    </div>
                </div>
                <div class="the-thong-ke-item">
                    <div class="icon-thong-ke do">
                        <i class="fas fa-tools"></i>
                    </div>
                    <div class="thong-tin-thong-ke">
                        <h3 id="soPhongBaoTri">0</h3>
                        <p>Đang bảo trì</p>
                    </div>
                </div>
            </div>
            <!--Danh sách phòng-->
            <div class="danh-sach-phong">
                <table>
                    <tr>
                        <th>Mã phòng</th>
                        <th>Tên phòng</th>
                        <th>Tòa nhà</th>
                        <th>Số giường</th>
                        <th>Trạng thái</th>
                        <th>Thông tin sinh viên</th>
                    </tr>
                </table>
            </div>

        </main>

</body>

</html>
